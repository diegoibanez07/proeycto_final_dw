{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GarantiaPro{% endblock %}</title>
    <meta name="description" content="Plataforma publica para consultar garantias, reparaciones y estado de productos.">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=publico-visual-20260522">
</head>
<body class="sitio-publico">
    <header class="cabecera-publica">
        <a class="marca-publica" href="{% url 'inicio_publico' %}">
            <span>GR</span>
            <strong>GarantiaPro</strong>
        </a>
        <nav class="menu-publico" aria-label="Publico">
            <a href="{% url 'inicio_publico' %}">Inicio</a>
            <a href="{% url 'servicios_publicos' %}">Servicios</a>
            <a href="{% url 'solicitar_servicio_publico' %}">Solicitar garantia</a>
            <a href="{% url 'consulta_estado_publico' %}">Consultar estado</a>
            <a class="enlace-ingreso" href="{% url 'login' %}">Ingreso empresa</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script defer src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script defer src="{% static 'js/app.js' %}?v=publico-visual-20260522"></script>
</body>
</html>
